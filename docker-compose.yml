version: '3.9'

services:
  database:
    container_name: fitness_app_db
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fitness_app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: